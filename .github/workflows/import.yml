name: Import project snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack snapshot
        run: |
          unzip -o cn-wealth-quant.zip -d .
          rm -f cn-wealth-quant.zip
      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import full project snapshot"
          git push
